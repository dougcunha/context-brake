name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-independent gates run once; the test suite runs once, with coverage.
  checks:
    name: Checks and coverage (Node 20 on ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Schema currency check
        run: npm run schemas:check

      - name: Dependency scripts check
        run: npm run dependencies:check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run coverage

      - name: Package smoke test
        run: npm run package:smoke

  # Every supported OS runs the suite once; Node 20 is the engines floor and Node 24 the newest release.
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-version: 20
          - os: macos-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 24

    steps:
      - name: Configure Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package smoke test
        run: npm run package:smoke
