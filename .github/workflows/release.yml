name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Schema currency check
        run: npm run schemas:check

      - name: Dependency scripts check
        run: npm run dependencies:check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run acceptance-scale tests with coverage
        run: npm run coverage -- --mode acceptance

      - name: Package smoke test
        run: npm run package:smoke

      - name: Verify release tag consistency
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            npx tsx scripts/check-release-tag.ts --tag "${{ github.event.inputs.tag }}"
          else
            npx tsx scripts/check-release-tag.ts
          fi

      - name: Setup Node.js 24 for staged publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with staged publishing
        run: npm install --global npm@11.20.0

      - name: Stage the npm release with provenance
        run: npm stage publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ask for the staged release approval
        run: |
          {
            echo "### npm release staged"
            echo "Approve it with 2FA: \`npm stage list context-brake\`, then \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" --title "${TAG}" --generate-notes ${PRERELEASE_FLAG}
        env:
          GH_TOKEN: ${{ github.token }}
